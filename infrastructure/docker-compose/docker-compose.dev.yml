services:
  blockchain-node:
    image: node:20
    container_name: sky-rock-blockchain
    working_dir: /app/blockchain
    command: sh -c "npm install && npm run node"
    ports:
      - "8545:8545"
    volumes:
      - ../../:/app

  api:
    image: python:3.11
    container_name: sky-rock-api
    depends_on:
      - blockchain-node
    working_dir: /app
    command: >
      sh -c "pip install -r services/api/requirements.txt &&
             uvicorn services.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ../../:/app